[package]
name = "chatcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "ChatCraft desktop app"

[lints]
workspace = true

[dependencies]
chatcraft-engine = { workspace = true }
chatcraft-net = { workspace = true }
chatcraft-matrix = { workspace = true }
chatcraft-ui-egui = { workspace = true }
# Opens links (and the single-sign-on page) in the system browser.
egui-winit = { version = "0.37", default-features = false, features = ["links"] }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
log = { workspace = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
serde_json = { workspace = true }
