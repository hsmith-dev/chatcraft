[package]
name = "chatcraft-web"
description = "ChatCraft in the browser (eframe web runner; the demo workspace runs in-page)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
chatcraft-engine = { workspace = true }
chatcraft-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
chatcraft-matrix = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "Location", "Storage", "UrlSearchParams", "History"] }
serde_json = { workspace = true }
